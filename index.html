<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Lojas — Impressão 3D</title>
<script>
(function () {
  try {
    var t = localStorage.getItem("gestaoLojas3D_theme") || "light";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="login.css">
</head>
<body>

<section class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-logo">◇</div>
    <h1 id="auth-title">Gestão de Lojas</h1>
    <p id="auth-subtitle">Entre para acessar o painel da loja Zequi Gamer.</p>

    <form id="login-form" class="login-form">
      <label for="login-email">E-mail</label>
      <input id="login-email" type="email" autocomplete="username" required placeholder="seu@email.com">
      <label for="login-password">Senha</label>
      <input id="login-password" type="password" autocomplete="current-password" required placeholder="Sua senha">
      <button class="auth-link" id="btn-forgot-password" type="button">Esqueci minha senha</button>
      <div class="login-error" id="login-error" role="alert"></div>
      <button class="login-submit" id="login-submit" type="submit">Entrar</button>
    </form>

    <form id="forgot-form" class="login-form" hidden>
      <label for="forgot-email">E-mail cadastrado</label>
      <input id="forgot-email" type="email" autocomplete="email" required placeholder="seu@email.com">
      <div class="login-message" id="forgot-message" role="status"></div>
      <button class="login-submit" id="forgot-submit" type="submit">Enviar link de recuperação</button>
      <button class="auth-link auth-link-center" id="btn-back-login" type="button">Voltar para o login</button>
    </form>

    <form id="reset-form" class="login-form" hidden>
      <label for="new-password">Nova senha</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="8" required placeholder="Digite a nova senha">
      <label for="confirm-password">Confirmar nova senha</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required placeholder="Digite novamente">
      <div class="login-error" id="reset-error" role="alert"></div>
      <div class="login-message" id="reset-message" role="status"></div>
      <button class="login-submit" id="reset-submit" type="submit">Salvar nova senha</button>
    </form>

    <small id="auth-footer">Acesso restrito.</small>
  </div>
</section>

<div class="app" hidden>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark">◇</span>
      <div class="brand-text">
        <strong>Gestão de Lojas</strong>
        <span>Impressão 3D &amp; Revenda</span>
      </div>
      <button id="btn-toggle-sidebar" class="collapse-toggle" title="Recolher menu">‹</button>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-footer">
      <button id="btn-theme-toggle" class="ghost-btn" title="Alternar tema"><span class="btn-icon">☾</span><span class="btn-label">Modo escuro</span></button>
      <button id="btn-export" class="ghost-btn" title="Exportar backup"><span class="btn-icon">⭳</span><span class="btn-label">Exportar backup</span></button>
      <label class="ghost-btn" for="file-import" title="Importar backup"><span class="btn-icon">⭱</span><span class="btn-label">Importar backup</span></label>
      <input type="file" id="file-import" accept="application/json" hidden>
      <button id="btn-logout" class="ghost-btn" title="Sair da conta"><span class="btn-icon">↪</span><span class="btn-label">Sair</span></button>
      <p class="hint">Os dados ficam salvos neste navegador. Exporte um backup de vez em quando.</p>
    </div>
  </aside>

  <main class="content" id="content">
    <div class="empty-state">Carregando dados…</div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
</body>
</html>
